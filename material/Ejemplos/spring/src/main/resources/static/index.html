<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API de productos</title><style>body{max-width:55rem;margin:2rem auto;padding:1rem;font:1rem/1.5 system-ui}label{display:block}input,button{font:inherit;padding:.5rem}li{margin:1rem 0}button{margin-left:.4rem}</style><script type="module" src="app.js"></script></head><body><h1>Productos · API local</h1><p>Datos de práctica que se reinician al cerrar. Sin cuentas ni pagos.</p><form id="producto"><label for="nombre">Nombre</label><input id="nombre" name="nombre" required><label for="precio">Precio</label><input id="precio" name="precio" type="number" min="0" step="0.01" required><label for="stock">Stock</label><input id="stock" name="stock" type="number" min="0" step="1" required><p><button id="guardar" type="submit">Crear producto</button><button id="cancelar" type="button" hidden>Cancelar edición</button></p></form><p id="estado" role="status"></p><h2>Listado</h2><ul id="lista"></ul></body></html>
